name: setup
description: >
  The pinned Node and pnpm, the workspace installed, and optionally built.

inputs:
  build:
    description: >
      What to build once installed: `libs` for the @prose-reader/* packages,
      `all` for every project, empty for nothing.
    default: ""

runs:
  using: composite
  steps:
    # before setup-node, whose pnpm cache needs pnpm on the PATH; the
    # version comes from `packageManager` in the root package.json
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Every run builds from source. nx keys its task database by machine ID,
    # so it rejects build outputs that a CI cache restores from a runner with
    # another ID.
    - if: inputs.build != ''
      name: Build
      shell: bash
      env:
        BUILD: ${{ inputs.build }}
      run: |
        case "$BUILD" in
          libs) pnpm run build:lib ;;
          all) pnpm run build ;;
          *) echo "::error::unknown build '$BUILD', expected libs or all"; exit 1 ;;
        esac
