name: browser test on macOS

# `check` runs the browser suite on Linux. This runs it on macOS once a day,
# on the default branch: WebKit there is the closest CI has to Safari, and
# macOS lays text out with its own fonts, so a regression that only shows on
# macOS is found within a day. The screenshot baselines are rendered on Linux,
# so this run skips the comparisons.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  browser:
    uses: ./.github/workflows/_browser_test.yml
    with:
      runs-on: macos-latest
      ignore-snapshots: true
