name: ts_react_native_demo

on:
  workflow_call:

jobs:
  ts_react_native_demo:
    # ubuntu: Metro bundles for iOS and Android alike without Xcode or an
    # Android SDK, so nothing here needs macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The demo consumes @prose-reader/* through file: links that resolve to
      # each package's dist/, which is gitignored — build the libs first.
      - uses: ./.github/actions/setup
        with:
          build: libs

      # The demo is not a workspace member: it installs with npm from its own
      # lockfile, the way an app consuming the libraries would. setup-node caches
      # one package manager, so npm's cache is kept here.
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-demo-npm-${{ hashFiles('prose-react-native-demo/package-lock.json') }}

      - name: Typecheck demo
        working-directory: prose-react-native-demo
        run: |
          npm ci
          npm run tsc

      # Typechecking never resolves a module the way Metro does, so the demo
      # spent a long time unable to bundle at all without anything failing.
      # Bundling it here is what proves the libraries are consumable from React
      # Native — including that an ESM-only dependency survives Metro.
      #
      # Both platforms: Metro resolves each one separately, down to platform
      # specific files and export conditions, so an iOS bundle says nothing
      # about Android. Web is left out — `expo export` can build it, but through
      # react-native-web, which is not what this demo ships; its web side is the
      # vite app in `web/`.
      #
      # The vite app is covered all the same. It builds the page the WebView
      # renders, which is not committed and which both native bundles embed as
      # an asset, so `bundle` builds it before either export. This step
      # therefore also proves the web side builds against the libraries above.
      - name: Bundle demo
        working-directory: prose-react-native-demo
        run: npm run bundle
