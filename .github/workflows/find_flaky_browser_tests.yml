name: find flaky browser tests

# Runs the browser suite many times with no retry, so that a test which fails
# once in a while fails here. In `check`, a retry that passes leaves the job
# green and hides it.
on:
  workflow_dispatch:
    inputs:
      repeat-each:
        description: How many times to run each test
        type: number
        default: 20
      project:
        description: >
          The Playwright projects to run, as a name or a glob such as
          `webkit*`. Empty runs every project.
        type: string
        default: ""
      tests:
        description: >
          The spec files or filters to run, separated by spaces, as
          `playwright test` takes them. Empty runs every spec.
        type: string
        default: ""

jobs:
  # In the image `check` runs the suite in, so that a result here holds for
  # CI. Its tag follows the version of @playwright/test.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute
      # the runner's user, who owns the workspace and the home directory
      options: --user 1001
    # One run of the suite takes about 21 minutes on the 3 workers of one
    # Linux runner, so the default 20 runs take about 85 minutes on each of
    # the 5 shards, and the job holds about 55 runs.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # The report job counts the shards too.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-browser-suite
        with:
          install-browsers: false

      # Playwright stops itself 10 minutes before the job's limit, so that the
      # shard still writes the report of the tests it ran.
      - name: Test
        env:
          REPEAT_EACH: ${{ inputs.repeat-each }}
          PROJECT: ${{ inputs.project }}
          TESTS: ${{ inputs.tests }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          read -ra tests <<< "$TESTS"
          args=(--repeat-each="$REPEAT_EACH" --retries=0 --shard="$SHARD" --reporter=blob --global-timeout=13800000)
          if [ -n "$PROJECT" ]; then args+=(--project="$PROJECT"); fi
          pnpm --filter prose-reader-tests test "${args[@]}" "${tests[@]}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/tests/blob-report/
          retention-days: 15

  report:
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: apps/tests/all-blob-reports
          merge-multiple: true

      - name: Merge the reports
        working-directory: apps/tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: report.json
        run: pnpm exec playwright merge-reports --reporter=html,json all-blob-reports

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/tests/playwright-report/
          retention-days: 15

      # The table has one row per test and project: each repeat of a test is
      # a test of its own in the report. A test is named with its `describe`
      # titles: a loop that varies only a `describe` writes tests that share
      # their line and title. A shard with no report did not end, so the job
      # fails when one is missing: the summary covers part of the suite then.
      - name: Write the summary
        working-directory: apps/tests
        env:
          # the shards of the browser job's matrix
          SHARD_COUNT: 5
        run: |
          shard_reports=$(find all-blob-reports -name '*.zip' | wc -l | tr -d ' ')
          {
            echo "## Browser tests run with no retry"
            echo
            echo "Reports of ${shard_reports} of ${SHARD_COUNT} shards."
            jq -r '
              def specs_with_titles($titles):
                (.specs[]? | { titles: ($titles + [.title]), spec: . }),
                (.suites[]? as $suite | $suite | specs_with_titles($titles + [$suite.title]));
              def first_line: split("\n")[0] | gsub("\u001b\\[[0-9;]*m"; "");
              (.stats | "Runs: \(.expected + .unexpected + .flaky + .skipped), passed: \(.expected), failed: \(.unexpected), skipped: \(.skipped)."),
              (if (.errors | length) > 0
                then "", "Errors outside a test:", "", (.errors[] | "- \(.message // "" | first_line)")
                else empty end),
              "", "### Tests that failed at least once", "",
              ([ .suites[] | specs_with_titles([]) | .titles as $titles | .spec as $spec
                 | $spec.tests[]
                 | { project: .projectName,
                     test: "\($spec.file):\($spec.line) \($titles | join(" › "))",
                     failed: (.status == "unexpected") } ]
                | group_by([.project, .test])
                | map({ project: .[0].project, test: .[0].test, runs: length,
                        failures: (map(select(.failed)) | length) })
                | map(select(.failures > 0))
                | sort_by(-.failures)
                | if length == 0 then "None."
                  else ("| Failed runs | Project | Test |", "| --- | --- | --- |",
                        (.[] | "| \(.failures) of \(.runs) | \(.project) | \(.test) |"))
                  end)
            ' report.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$shard_reports" -ne "$SHARD_COUNT" ]; then
            echo "::error::Reports of ${shard_reports} of ${SHARD_COUNT} shards: the summary covers part of the suite."
            exit 1
          fi
