name: check_publish_lib

on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'npm'
  
      - uses: actions/cache@v5
        id: nx-cache
        with:
          path: |
            .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}

      - name: Prepare
        run: |
          npm ci
          npx lerna run build --stream --scope @prose-reader/*

  lint:
    uses: ./.github/workflows/_lint.yml

  ts:
    uses: ./.github/workflows/_ts.yml

  ts_react_native_demo:
    uses: ./.github/workflows/_ts_react_native_demo.yml

  tests:
    uses: ./.github/workflows/_test.yml

  docker:
    uses: ./.github/workflows/_docker.yml

  publish:
    needs: [lint, ts, ts_react_native_demo, tests, docker, build]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # The bump below is computed from the commits since the last release
          # tag, so this job needs real history and tags rather than the default
          # shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'npm'
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v5
        id: nx-cache
        with:
          path: |
            .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}

      - name: Prepare
        run: |
          npm ci
          npx lerna run build --stream --scope @prose-reader/*

      # Every push to master publishes, so `minor` stays the default and the
      # release cadence is unchanged. A breaking change is the one case that
      # must not ship as a minor: consumers sit on caret ranges and would pick
      # it up without asking for it. Such a change announces itself with the
      # conventional-commit markers — `feat!:` / `fix(scope)!:` in a subject, or
      # a `BREAKING CHANGE:` footer in a body — so look for those across
      # everything merged since the last release tag.
      #
      # This reads what the author wrote: an unmarked breaking change still
      # ships as a minor. Marking it is the contract.
      - name: Choose the version bump
        id: bump
        run: |
          # With no tag to bound it, scanning would walk the whole history and
          # find an old `!:` every time, making every release a major. Fall back
          # to the merged commit alone instead — master takes one squashed
          # commit per pull request.
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${last_tag:+$last_tag..HEAD}

          if git log ${range:--1} --format=%B \
            | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
            bump=major
          else
            bump=minor
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Publishing a $bump release (scanned: ${range:-HEAD~1..HEAD})"

      - name: Publish
        run: |
          git config --global user.email "bret.maxime@gmail.com"
          git config --global user.name "Maxime Bret"
          npx lerna publish ${{ steps.bump.outputs.bump }} --no-private --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

  # The metadata fetcher ships as a container too, so a library app can run
  # lookups without depending on the npm package. Same release as the libs: one
  # image per published version.
  publish_docker:
    needs: [publish]
    # ubuntu, unlike the rest: GitHub's macOS runners ship no docker daemon
    runs-on: ubuntu-latest

    steps:
      # master, not the commit that triggered this run: `lerna publish` has
      # just pushed the version bump, and the image should carry it
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Read the published version
        id: release
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"

      # arm64 as well as amd64: the point of the image is that someone can run
      # a metadata service without a toolchain, and that includes Apple silicon
      # and ARM hosts. It is emulated, so it leans on the layer cache — drop
      # the platform if release time ever matters more.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged with the version too, not just `latest`: every push here
      # publishes a release, so a deployment can pin one and roll back to it.
      - name: Build and push metadata fetcher API
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: apps/metadata-fetcher-api/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mbret/prose-metadata-fetcher-api:${{ steps.release.outputs.version }}
            mbret/prose-metadata-fetcher-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
