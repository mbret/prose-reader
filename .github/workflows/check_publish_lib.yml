name: check_publish_lib

on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'npm'
  
      - uses: actions/cache@v5
        id: nx-cache
        with:
          path: |
            .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}

      - name: Prepare
        run: |
          npm ci
          npx lerna run build --stream --scope @prose-reader/*

  lint:
    uses: ./.github/workflows/_lint.yml

  ts:
    uses: ./.github/workflows/_ts.yml

  ts_react_native_demo:
    uses: ./.github/workflows/_ts_react_native_demo.yml

  tests:
    uses: ./.github/workflows/_test.yml

  docker:
    uses: ./.github/workflows/_docker.yml

  publish:
    needs: [lint, ts, ts_react_native_demo, tests, docker, build]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'npm'
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v5
        id: nx-cache
        with:
          path: |
            .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package-lock.json') }}

      - name: Prepare
        run: |
          npm ci
          npx lerna run build --stream --scope @prose-reader/*

      - name: Publish
        run: |
          git config --global user.email "bret.maxime@gmail.com"
          git config --global user.name "Maxime Bret"
          npx lerna publish minor --no-private --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

  # The metadata fetcher ships as a container too, so a library app can run
  # lookups without depending on the npm package. Same release as the libs: one
  # image per published version.
  publish_docker:
    needs: [publish]
    # ubuntu, unlike the rest: GitHub's macOS runners ship no docker daemon
    runs-on: ubuntu-latest

    steps:
      # master, not the commit that triggered this run: `lerna publish` has
      # just pushed the version bump, and the image should carry it
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Read the published version
        id: release
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"

      # arm64 as well as amd64: the point of the image is that someone can run
      # a metadata service without a toolchain, and that includes Apple silicon
      # and ARM hosts. It is emulated, so it leans on the layer cache — drop
      # the platform if release time ever matters more.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagged with the version too, not just `latest`: every push here
      # publishes a release, so a deployment can pin one and roll back to it.
      - name: Build and push metadata fetcher API
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: apps/metadata-fetcher-api/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mbret/prose-metadata-fetcher-api:${{ steps.release.outputs.version }}
            mbret/prose-metadata-fetcher-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
