name: ts

on:
  workflow_call:

jobs:
  ts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'pnpm'
      - name: Check
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run tsc
