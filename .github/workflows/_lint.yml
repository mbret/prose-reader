name: lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check
        run: |
          pnpm run format
          pnpm run lint
          pnpm run check:agent-docs
          pnpm run check:internal-ranges
