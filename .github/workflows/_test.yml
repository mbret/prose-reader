name: test

on:
  workflow_call:

jobs:
  # The vitest suites run in happy-dom or jsdom, with no browser, so they need
  # none of the browser setup and run beside the browser jobs.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          build: libs
      - name: Test
        run: pnpm exec lerna run test --ignore prose-reader-tests

  # In Playwright's image, which holds the browser builds of its version and
  # the system packages they need, so a job installs neither. Its fonts render
  # the committed screenshot baselines (-linux). The image's tag follows the
  # version of @playwright/test, here and in find_flaky_browser_tests.yml, and
  # Playwright names the tag it needs when they differ.
  #
  # The projects of each browser engine (BROWSER_ENGINE in
  # playwright.config.ts) run in 2 jobs, through Playwright's `--shard`.
  # Sharding the whole suite by test count would put engines of different
  # speeds in one job: Firefox's tests take about 1.6 times as long as the
  # others'.
  browser:
    name: browser (${{ matrix.engine }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute
      # the runner's user, who owns the workspace and the home directory
      options: --user 1001
    strategy:
      # a failure on one engine says nothing about the others: let them report
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        # the jobs of an engine, as many as the `/2` of the test step says
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-browser-suite
        with:
          install-browsers: false

      - name: Test
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}/2
        run: pnpm --filter prose-reader-tests test --shard="$SHARD"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.engine }}-${{ matrix.shard }}
          path: apps/tests/test-results/
          retention-days: 15
          # Playwright only writes here for a failed or retried test, so a
          # green job has nothing to upload and nothing to warn about
          if-no-files-found: ignore
