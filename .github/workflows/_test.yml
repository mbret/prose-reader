name: test

on:
  workflow_call:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        id: nx-cache
        with:
          path: |
            .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: |
          pnpm exec lerna run build --stream --scope @prose-reader/*

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        # On a cache hit the browsers are already present; install still runs to
        # verify/refresh them but skips the multi-hundred-MB download. Playwright
        # is the test app's dependency, not the root's, so run it from there.
        run: pnpm --filter prose-reader-tests exec playwright install --with-deps

      - name: Test
        run: |
          pnpm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/tests/test-results/
          retention-days: 15