name: test

on:
  workflow_call:

jobs:
  # The vitest suites run in happy-dom or jsdom, with no browser, so they need
  # none of the browser setup and run beside the browser jobs.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          build: libs
      - name: Test
        run: pnpm exec lerna run test --ignore prose-reader-tests

  # On Linux, where the committed screenshot baselines are rendered (-linux).
  browser:
    uses: ./.github/workflows/_browser_test.yml
