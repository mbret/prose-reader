# Development stack for the metadata fetcher. Started from the repository root
# with
#
#   npm run start:metadata-fetcher
#
# One service: the API source *and* the library source are bind-mounted into
# it, and node runs both as TypeScript — so an edit on the host is an edit in
# the container. No build, no watcher, no reinstall.

name: prose-metadata-fetcher

services:
  api:
    build:
      context: ../..
      dockerfile: apps/metadata-fetcher-api/Dockerfile
      target: development
    image: prose-reader/metadata-fetcher-api:development
    working_dir: /repo/apps/metadata-fetcher-api
    # node as PID 1 rather than `npm run dev`: it receives SIGTERM directly, so
    # `docker compose down` stops in milliseconds instead of waiting out the
    # kill timer. `--conditions=prose-source` resolves
    # @prose-reader/metadata-fetcher to its TypeScript source, and `--watch`
    # then restarts on any file it imported — the library's included.
    command:
      [
        "node",
        "--conditions=prose-source",
        "--watch",
        "--watch-preserve-output",
        "src/server.ts",
      ]
    ports:
      - "${METADATA_FETCHER_PORT:-3000}:3000"
    environment:
      PORT: 3000
      # Open Library asks API clients to identify themselves — put your app
      # and a contact here (see the app README)
      OPEN_LIBRARY_USER_AGENT: ${OPEN_LIBRARY_USER_AGENT:-prose-reader-metadata-fetcher-api (development)}
      METADATA_LIMIT: ${METADATA_LIMIT:-5}
      METADATA_MIN_SCORE: ${METADATA_MIN_SCORE:-0.5}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
    volumes:
      - ../../apps/metadata-fetcher-api/src:/repo/apps/metadata-fetcher-api/src:ro
      - ../../packages/metadata-fetcher/src:/repo/packages/metadata-fetcher/src:ro
