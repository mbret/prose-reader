packages:
  - apps/*
  - packages/*

# Dependency build scripts are off unless listed. Both of these ship prebuilt
# native binaries through optional dependencies, so their scripts have nothing
# to do here: nx's only refreshes an Nx Cloud client this repository does not
# use, and @parcel/watcher's compiles from source only when no prebuilt binary
# matches the platform.
allowBuilds:
  '@parcel/watcher': false
  nx: false

# lerna and nx pin their dependencies to exact versions, so an in-range update
# cannot move them; each override stays inside the major its consumer asked
# for. `brace-expansion` is keyed to nx's exact pin because three majors of it
# coexist in the tree.
overrides:
  axios: ^1.20.0
  brace-expansion@5.0.6: ^5.0.12
  js-yaml: ^4.3.2
  pacote: ^21.5.1
  smol-toml: ^1.9.0
  tar: ^7.5.22
