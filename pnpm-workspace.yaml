packages:
  - apps/*
  - packages/*

# Dependency build scripts are off unless listed. Both of these ship prebuilt
# native binaries through optional dependencies, so their scripts have nothing
# to do here: nx's only refreshes an Nx Cloud client this repository does not
# use, and @parcel/watcher's compiles from source only when no prebuilt binary
# matches the platform.
allowBuilds:
  '@parcel/watcher': false
  nx: false

# pnpm refuses versions published less than a day ago (minimumReleaseAge).
# gesturx comes from the same author as prose and is released by its own CI,
# so a release prose needs can be taken as soon as it is out. Entries name an
# exact version, so each one is let through deliberately, and one does
# nothing once its version is a day old.
minimumReleaseAgeExclude:
  - gesturx@1.11.1
